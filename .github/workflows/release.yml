name: Release
on:
  push:
    tags: ['v*']
  # Пробний запуск: збирає й перевіряє архів, але нічого не публікує.
  pull_request:
    paths: ['.github/workflows/release.yml']
permissions:
  contents: read
env:
  TARGET: x86_64-unknown-linux-gnu
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match version $version from Cargo.toml"; exit 1 ;;
          esac
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package
        env:
          LABEL: ${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}
        run: |
          mkdir dist
          archive="osavul-$LABEL-$TARGET.tar.gz"
          tar -czf "dist/$archive" -C "target/$TARGET/release" osavul
          cd dist
          sha256sum "$archive" > SHA256SUMS
      - name: Run the packaged binary
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          (cd dist && sha256sum -c SHA256SUMS)
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/osavul" complexity --path tests/fixtures/ts-cyclomatic
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - run: sha256sum -c SHA256SUMS
        working-directory: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # З файлами `gh release create` сам створює чернетку й публікує її лише після завантаження всіх:
      # опублікований реліз незмінний.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
